<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForTranslate 设置</title>
  <link rel="stylesheet" href="../ui.css">
</head>
<body>
  <main class="page">
    <div class="brand"><span class="tone" aria-hidden="true">่</span><span>ForTranslate</span></div>
    <h1>连接你的翻译服务</h1>
    <p class="page-lead">扩展只会发送你主动选择的文字或图片。模型密钥保留在服务器，不写入扩展。</p>
    <form id="settings-form" class="card">
      <div class="field">
        <label for="api-base-url">服务地址</label>
        <input id="api-base-url" name="apiBaseUrl" type="url" required placeholder="https://你的私有服务地址">
        <div class="help">填写 Tailscale 私有地址或 HTTPS 地址，不包含末尾斜杠。</div>
      </div>
      <div class="field">
        <label for="access-token">访问令牌</label>
        <input id="access-token" name="accessToken" type="password" autocomplete="off" placeholder="用于验证当前设备">
        <div class="help">这是你的后端访问令牌，不是大模型 API Key。</div>
      </div>
      <div class="field">
        <label for="timeout">请求超时（毫秒）</label>
        <input id="timeout" name="requestTimeoutMs" type="number" min="5000" max="180000" step="1000">
      </div>
      <div class="field">
        <label for="result-font-size">中文译文字号：<output id="result-font-size-value" for="result-font-size">13px</output></label>
        <input id="result-font-size" name="resultFontSize" type="range" min="12" max="18" step="1">
        <div class="help">同时调整网页翻译浮窗和侧边栏中的中文译文。</div>
      </div>
      <div class="divider"></div>
      <div class="switch-row">
        <div>
          <div class="field-title">保存最近翻译</div>
          <div class="help">仅在此浏览器保存文字与译文，最多 50 条；不保存图片。</div>
        </div>
        <label class="switch" aria-label="保存最近翻译">
          <input id="save-history" type="checkbox">
          <span aria-hidden="true"></span>
        </label>
      </div>
      <div class="actions">
        <button class="primary" type="submit">保存设置</button>
        <button id="test" class="quiet-button" type="button">测试连接</button>
        <button id="clear-history" class="quiet-button" type="button">清空历史</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
