<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForTranslate</title>
  <link rel="stylesheet" href="../ui.css">
</head>
<body>
  <main class="shell">
    <div class="topline">
      <div class="brand"><span class="tone" aria-hidden="true">่</span><span>ForTranslate</span><span id="version" class="version"></span></div>
      <button id="open-settings" class="quiet-button" type="button">设置</button>
    </div>
    <div class="field">
      <label for="source-text">泰语原文</label>
      <textarea id="source-text" maxlength="10000" placeholder="在这里粘贴需要翻译的内容…"></textarea>
    </div>
    <div class="translate-actions">
      <button id="translate" class="primary" type="button">翻译</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="result" class="result" hidden aria-label="翻译结果">
      <div class="result-label">中文</div>
      <div id="result-text" class="result-text"></div>
      <div class="result-row">
        <span id="usage" class="status"></span>
        <button id="copy" class="quiet-button" type="button">复制译文</button>
      </div>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
